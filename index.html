<!doctype html>
<html lang="de">
<head>
 <link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bänkle.App</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#fff}
#app{height:100%;display:flex;flex-direction:column}
header{height:92px;flex:none;background:#49a942;color:#fff;padding:14px 16px}
h1{font-size:22px;margin:0 0 9px}.search{width:100%;height:36px;border:0;border-radius:9px;padding:0 12px;font-size:15px}
#map{position:relative;flex:1;min-height:0}#mapcanvas{position:absolute;inset:0}
.controls{
 position:absolute;right:12px;top:12px;z-index:5;
 display:flex;flex-direction:column;gap:4px;
 padding:8px 7px;
 border-radius:34px;
 background:rgba(24,91,98,.78);
 box-shadow:0 2px 10px #0005;
}
.controls button{
 width:58px;height:58px;border:0;border-radius:50%;
 background:transparent;color:#fff;
 display:flex;align-items:center;justify-content:center;
 padding:0;cursor:pointer;
}
.controls button:active{background:rgba(255,255,255,.12)}
.controls svg{width:36px;height:36px;display:block}
#loc.active{background:rgba(255,255,255,.10)}
#maptype.active{background:rgba(255,255,255,.14)}
#locationStatus{position:absolute;left:12px;bottom:12px;z-index:6;background:#fff;border-radius:10px;padding:9px 12px;box-shadow:0 2px 9px #0004;font-size:12px;display:none}
.user-dot{width:20px;height:20px;border-radius:50%;background:#1976d2;border:4px solid #fff;box-shadow:0 1px 8px #0008}
.profile{display:none;position:absolute;inset:0;z-index:8;background:#f5f5f5;padding:24px}.profile-card{background:#fff;border-radius:15px;padding:20px}
nav{height:66px;flex:none;display:flex;background:#fff;border-top:1px solid #ddd;z-index:20}
nav button{flex:1;border:0;background:#fff;color:#555;font-size:11px}nav b{display:block;font-size:21px;margin-bottom:3px}nav .active{color:#319331;font-weight:bold}

/* Kleinere Karten-Bedienung */
.map-switcher{
  transform:scale(.60);
  transform-origin:top right;
}

/* Liquid Glass – Kartensteuerung */
.map-switcher{
  transform:scale(.60);
  transform-origin:top right;
  background:rgba(255,255,255,.18) !important;
  border:1px solid rgba(255,255,255,.35) !important;
  box-shadow:0 8px 28px rgba(0,0,0,.22),inset 0 1px 1px rgba(255,255,255,.42),inset 0 -1px 1px rgba(0,0,0,.10) !important;
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  overflow:hidden;
}
.map-switcher button{
  background:rgba(255,255,255,.13) !important;
  border-color:rgba(255,255,255,.22) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35) !important;
}
.map-switcher button:active{
  background:rgba(255,255,255,.30) !important;
  transform:scale(.94);
}
</style>



<style>
.header-plus{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border:1px solid rgba(255,255,255,.35);
  border-radius:12px;
  background:rgba(255,255,255,.16);
  color:white;
  font-size:28px;
  line-height:36px;
  text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.35);
  backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
  z-index:50;
}
.header-plus:active{transform:translateY(-50%) scale(.92)}
</style>

<style id="waypoint-style">
.waypoint-pin{
 width:22px;height:22px;border-radius:50% 50% 50% 0;
 background:#e53935;border:3px solid #fff;
 box-shadow:0 2px 8px rgba(0,0,0,.45);
 transform:rotate(-45deg);
}
.waypoint-pin:after{
 content:"";display:block;width:7px;height:7px;border-radius:50%;
 background:#fff;margin:5px;
}
.header-plus.active{background:rgba(76,175,67,.72)!important}
</style>

<style id="baenkle-banner-style">
.baenkle-banner{display:block!important;width:100%!important;height:20px!important;max-height:20px!important;object-fit:contain!important;object-position:left center!important;background:#43a047!important;border:0!important;margin:0!important;padding:0!important}
</style>

<style id="baenkle-exact-header">
.baenkle-banner{
  display:block!important;
  width:100%!important;
  height:72px!important;
  max-height:72px!important;
  object-fit:contain!important;
  object-position:left center!important;
  background:#43a047!important;
  border:0!important;
  margin:0!important;
  padding:0!important;
}
header:has(>.baenkle-banner){height:20px!important;max-height:20px!important;overflow:hidden!important;background:#43a047!important;margin:0!important;padding:0!important}
</style>
</head>

<script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<script>
const map=new maplibregl.Map({
 container:'mapcanvas',
 style:'https://tiles.openfreemap.org/styles/liberty',
 center:[9.99,53.55],zoom:6,maxZoom:19,attributionControl:true
});
map.setRenderWorldCopies(false);

let userMarker=null,watchId=null;
const status=document.getElementById('locationStatus');
const locButton=document.getElementById('loc');
const mapTypeButton=document.getElementById('maptype');
let satelliteMode=false;

function statusText(t,show=true){status.textContent=t;status.style.display=show?'block':'none';}

function updateStandort(position,center=true){
 const lng=position.coords.longitude,lat=position.coords.latitude;
 if(!userMarker){
   const el=document.createElement('div');el.className='user-dot';
   userMarker=new maplibregl.Marker({element:el}).setLngLat([lng,lat]).addTo(map);
 }else userMarker.setLngLat([lng,lat]);
 if(center)map.flyTo({center:[lng,lat],zoom:16,essential:true});
 statusText('Standort aktiv',true);setTimeout(()=>statusText('',false),1800);
 locButton.classList.add('active');
}

function locationError(err){
 const messages={
  1:'Standortzugriff abgelehnt. Bitte Standort für diese Webseite erlauben.',
  2:'Standort momentan nicht verfügbar.',
  3:'Standortabfrage dauerte zu lange.'
 };
 statusText(messages[err.code]||'Standort konnte nicht ermittelt werden.',true);
}

function locate(){
 if(!window.isSecureContext){
   statusText('Standort benötigt HTTPS. Diese HTML-Datei muss über eine HTTPS-Webseite geöffnet werden.',true);
   return;
 }
 if(!navigator.geolocation){
   statusText('Dieser Browser unterstützt keinen Standort.',true);return;
 }
 statusText('Standort wird ermittelt…',true);
 navigator.geolocation.getCurrentPosition(updateStandort,locationError,{
   enableHighAccuracy:true,timeout:20000,maximumAge:0
 });
 if(watchId===null){
   watchId=navigator.geolocation.watchPosition(
    p=>updateStandort(p,false),locationError,
    {enableHighAccuracy:true,timeout:20000,maximumAge:3000}
   );
 }
}

map.on('load',()=>{
  try {
    map.getStyle().layers.forEach(function(layer) {
      if (layer.type === 'symbol' && layer.layout &&
          Object.prototype.hasOwnProperty.call(layer.layout, 'text-field')) {
        map.setLayoutProperty(layer.id, 'text-field',
          ['coalesce',['get','name:de'],['get','name'],['get','name_en']]);
      }
    });
  } catch(e) {}

  // Raster-Satellitenbilder hinzufügen, ohne den normalen Kartenstil auszublenden.
  try {
    if (!map.getSource('satellite')) {
      map.addSource('satellite', {
        type:'raster',
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize:256, minzoom:0, maxzoom:19,
        attribution:'Imagery © Esri'
      });
    }
    if (!map.getLayer('satellite-imagery')) {
      const firstLabel=(map.getStyle().layers||[]).find(l=>l.type==='symbol');
      map.addLayer({
        id:'satellite-imagery',
        type:'raster',
        source:'satellite',
        paint:{'raster-opacity':1,'raster-fade-duration':0},
        layout:{visibility:satelliteMode?'visible':'none'}
      }, firstLabel ? firstLabel.id : undefined);
    }
    mapTypeButton.classList.toggle('active',satelliteMode);
  } catch(err) {
    satelliteMode=false;
    mapTypeButton.classList.remove('active');
    console.error('Satellitenebene konnte nicht initialisiert werden:',err);
  }
});
locButton.onclick=locate;
mapTypeButton.onclick=()=>{
  satelliteMode=!satelliteMode;
  if(map.isStyleLoaded() && map.getLayer('satellite-imagery')) {
    map.setLayoutProperty('satellite-imagery','visibility',satelliteMode?'visible':'none');
  }
  mapTypeButton.classList.toggle('active',satelliteMode);
  mapTypeButton.title=satelliteMode?'Satellitenkarte – tippen für normale Karte':'Normale Karte – tippen für Satellitenkarte';
  mapTypeButton.setAttribute('aria-label',mapTypeButton.title);
};


document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 if(b.dataset.page==='profile')document.getElementById('profile').style.display='block';
 if(b.dataset.page==='map'){document.getElementById('profile').style.display='none';map.resize();}
});
</script>

<script id="waypoint-script">
(function(){
  var plus=document.querySelector('.header-plus');
  if(!plus) return;
  var placing=false, marker=null;

  plus.addEventListener('click',function(e){
    e.stopPropagation();
    placing=!placing;
    plus.classList.toggle('active',placing);
    plus.title=placing?'Auf die Karte tippen':'Wegpunkt setzen';
  });

  function attach(){
    if(typeof map==='undefined' || typeof maplibregl==='undefined'){
      setTimeout(attach,100);
      return;
    }
    map.on('click',function(e){
      if(!placing) return;
      if(marker) marker.remove();

      var el=document.createElement('div');
      el.className='waypoint-pin';

      marker=new maplibregl.Marker({element:el,anchor:'bottom'})
        .setLngLat(e.lngLat)
        .addTo(map);

      placing=false;
      plus.classList.remove('active');
      plus.title='Wegpunkt setzen';
    });
  }
  attach();
})();
</script>
